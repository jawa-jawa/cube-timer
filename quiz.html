<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1421"><title>配色クイズ｜CUBE TIME</title>
<link rel="stylesheet" href="./mode-nav.css?v=1.6">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1421;color:#edf3fb;font:16px/1.6 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:22px 16px 40px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}.panel{margin-top:18px;padding:20px;background:#142236;border:1px solid #2a3a50;border-radius:20px}.top{text-align:center;color:#f4d83b;font-weight:700}.score{text-align:center;color:#9dadc3;font-size:14px;margin:14px 0}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:center}.slot-label{font-size:13px;color:#9dadc3;margin-top:6px}.tile{width:100%;aspect-ratio:1;border-radius:14px;border:3px solid transparent;background:#f4f5f7;color:#101722;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,4vw,22px);font-weight:750;padding:4px;min-height:64px}.tile.active{outline:3px solid #86efc5;outline-offset:4px}.tile.wrong{border:3px dashed #9c182c}.tile.correct{border-color:#86efc5}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #86efc5;outline-offset:3px}button:disabled{cursor:default}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{display:flex;align-items:center;justify-content:center;gap:9px;background:#1d2f46;color:#edf3fb;border:1px solid #52637a;border-radius:12px;min-height:58px;padding:10px 4px}.swatch{width:22px;height:22px;border-radius:50%;flex-shrink:0}.primary{display:block;width:100%;background:#86efc5;color:#09251c;border:0;border-radius:12px;padding:14px;font-weight:750;min-height:50px;margin-top:18px}.primary:disabled{opacity:.35}.note{font-size:13px;color:#9dadc3;text-align:center}.feedback{text-align:center;font-weight:700;color:#86efc5}.feedback.miss{color:#ffb3b3}.answer-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.answer-row .tile{font-size:15px}footer{text-align:right;color:#9dadc3;font-size:12px;margin-top:22px}[hidden]{display:none!important}
</style><main><header><h1>配色クイズ</h1><label class="mode-picker">モード<select id="modeSelect" aria-label="モード選択"><option value="index.html">タイム計測</option><option value="practice.html">白十字練習</option><option value="quiz.html">配色クイズ</option></select></label></header>
<p class="top">🟨 黄色を上に固定</p><p id="score" class="score">正解 0 / 0問</p>
<section class="panel" aria-label="配色の問題"><div class="slots">
<div><button id="left" class="tile" aria-label="左の色を選択">？</button><div class="slot-label">左</div></div>
<div><div id="front" class="tile"></div><div class="slot-label">手前</div></div>
<div><button id="right" class="tile" aria-label="右の色を選択">？</button><div class="slot-label">右</div></div>
</div><p class="note">左右の枠をタップして色を選択</p></section>
<section id="picker" class="panel"><h2 id="pickTitle">左の色を選択</h2><div id="choices" class="choices"></div></section>
<button id="check" class="primary" disabled>答え合わせ</button>
<section id="result" class="panel" hidden><p id="feedback" class="feedback" role="status"></p><h2>正しい配色</h2><div id="answer" class="answer-row"></div></section>
<button id="next" class="primary" hidden>次の問題</button>
<footer>CUBE TIME · v1.6</footer></main><script src="./mode-nav.js?v=1.6" defer></script><script type="module" src="./quiz.js?v=1.6"></script></html>
