<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c2d">
<title>白十字練習｜CUBE TIME</title>
<style>
:root{color-scheme:dark;--bg:#0c1421;--panel:#142236;--text:#edf3fb;--muted:#9dadc3;--mint:#86efc5;--line:#2a3a50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 18px 50px}header,.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px}h2{font-size:17px;margin:0}p{margin:10px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}button,select,input,.back{font:inherit;color:var(--text);background:#1d2f46;border:1px solid #52637a;border-radius:10px;min-height:46px;padding:10px 14px}button,.back{cursor:pointer}button:disabled{opacity:.4}a.back{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.controls label{display:flex;flex-direction:column;gap:5px;font-size:13px}input{width:110px}.primary{background:var(--mint);color:#09251c;font-weight:700}.note{font-size:13px;color:var(--muted)}.moves{font:650 clamp(18px,4vw,24px)/1.9 ui-monospace,monospace;overflow-wrap:anywhere;color:var(--mint)}.count{font-size:13px;color:var(--mint)}#error{color:#ffb3b3}#net{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:660px;margin:20px auto}.face{min-width:0}.face-title{font-size:12px;text-align:center;margin-bottom:4px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#050b14;padding:3px;border-radius:5px}.tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#07111b;font-size:clamp(10px,2.5vw,18px);font-weight:700;border-radius:2px}.face-U{grid-column:2;grid-row:1}.face-L{grid-column:1;grid-row:2}.face-F{grid-column:2;grid-row:2}.face-R{grid-column:3;grid-row:2}.face-B{grid-column:4;grid-row:2}.face-D{grid-column:2;grid-row:3}[hidden]{display:none!important}@media(max-width:500px){.panel{padding:16px}#net{gap:4px}.tiles{gap:2px;padding:2px}}
</style>
<main>
<header><h1>白十字練習</h1><a class="back" href="./index.html">タイマーに戻る</a></header>
<p class="note">完成状態から、黄色を上・緑を手前にして開始してください。白十字は下面に作ります。</p>
<section class="panel">
<form id="generateForm" class="controls">
<label>混ぜる手数<select id="mode"><option value="standard">標準（これまでと同じ）</option><option value="custom">手数を指定</option></select></label>
<label id="countLabel" hidden>手数（1〜100）<input id="count" type="number" min="1" max="100" step="1" value="5" inputmode="numeric"></label>
<button id="generate" class="primary" type="submit">新しい練習を作る</button>
</form>
<p id="status" role="status" class="note"></p><p id="error" role="alert"></p>
</section>
<div id="results" hidden>
<section class="panel"><div class="head"><h2>① 混ぜる手順</h2><span id="scrambleSteps" class="count"></span></div><p id="scramble" class="moves"></p></section>
<section class="panel"><h2>混ぜた状態の6面</h2><div id="net" aria-label="スクランブル後の6面の展開図"></div><p class="note">前面を基準に開いた展開図です。センターは上＝黄、前＝緑、右＝橙。各マスの文字も色を示します。</p></section>
<section class="panel"><div class="head"><h2>② 白十字への最短手順</h2><span id="crossSteps" class="count"></span></div><p id="cross" class="moves"></p><p class="note">側面の色もセンターと一致させます。180°回転も1手として数えます。</p></section>
<section class="panel"><h2>混ぜた直後 → 6面完成</h2><p id="undoScramble" class="moves"></p><p class="note">①だけを実行した状態から使ってください。</p></section>
<section class="panel"><h2>白十字完成後 → 6面完成</h2><p id="undoCross" class="moves"></p><p class="note">①→②の順に実行した状態専用です。②を逆に戻し、続けて①を逆に戻します。6面をそろえる最短手順ではありません。</p></section>
</div>
</main>
<script type="module" src="./practice.js"></script>
</html>
